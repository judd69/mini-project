<!-- Chatbot Widget — included in base.html -->
<div id="chatbot-widget" class="fixed bottom-6 right-6 z-50">
    <!-- Toggle Button -->
    <button id="chatbot-toggle"
            class="w-14 h-14 rounded-full bg-gradient-to-br from-primary-500 to-purple-600 text-white shadow-lg shadow-primary-500/30 hover:shadow-primary-500/50 hover:scale-110 active:scale-95 transition-all duration-300 flex items-center justify-center group"
            onclick="toggleChatbot()"
            aria-label="Open support chat">
        <!-- Chat Icon -->
        <svg id="chat-icon-open" class="w-6 h-6 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
        </svg>
        <!-- Close Icon -->
        <svg id="chat-icon-close" class="w-6 h-6 hidden transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
        <!-- Pulse Ring -->
        <span class="absolute inset-0 rounded-full bg-primary-500/20 animate-ping pointer-events-none" id="chatbot-ping"></span>
    </button>

    <!-- Chat Panel -->
    <div id="chatbot-panel"
         class="hidden absolute bottom-20 right-0 w-80 sm:w-96 bg-surface-900/95 backdrop-blur-xl border border-white/10 rounded-2xl shadow-2xl shadow-black/40 overflow-hidden"
         style="height: 440px;">

        <!-- Header -->
        <div class="bg-gradient-to-r from-primary-600 to-purple-600 px-5 py-4 flex items-center gap-3">
            <div class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center">
                <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                </svg>
            </div>
            <div>
                <h3 class="text-sm font-semibold text-white">SecureVote Assistant</h3>
                <p class="text-xs text-white/60">Ask me anything about voting</p>
            </div>
            <div class="ml-auto flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span class="text-xs text-white/60">Online</span>
            </div>
        </div>

        <!-- Messages Area -->
        <div id="chatbot-messages" class="flex-1 overflow-y-auto p-4 space-y-3" style="height: 320px;">
            <!-- Welcome Message -->
            <div class="chat-bubble-bot animate-slide-up">
                <p>Hello! 👋 I'm the SecureVote assistant. I can help you with:</p>
                <ul class="mt-2 space-y-1 text-xs">
                    <li>• Registration & login</li>
                    <li>• Vote security & privacy</li>
                    <li>• Election results</li>
                    <li>• Technical support</li>
                </ul>
            </div>

            <!-- Quick Actions -->
            <div class="flex flex-wrap gap-2 animate-slide-up" style="animation-delay: 0.1s;">
                <button class="quick-action-btn" onclick="sendQuickMessage('How do I register?')">How to register?</button>
                <button class="quick-action-btn" onclick="sendQuickMessage('How is my vote secured?')">Vote security</button>
                <button class="quick-action-btn" onclick="sendQuickMessage('Can I change my vote?')">Change vote?</button>
            </div>
        </div>

        <!-- Input Area -->
        <div class="border-t border-white/5 p-3">
            <form id="chatbot-form" onsubmit="sendChatMessage(event)" class="flex items-center gap-2">
                <input type="text"
                       id="chatbot-input"
                       class="flex-1 bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-primary-500/50 focus:ring-1 focus:ring-primary-500/25 transition-all"
                       placeholder="Type your question..."
                       autocomplete="off">
                <button type="submit"
                        class="w-10 h-10 rounded-xl bg-primary-500 hover:bg-primary-600 active:scale-95 text-white flex items-center justify-center transition-all duration-200 shrink-0">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                    </svg>
                </button>
            </form>
        </div>
    </div>
</div>
